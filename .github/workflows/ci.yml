name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fish, bubblewrap, man pages
        run: sudo apt-get update && sudo apt-get install -y fish bubblewrap man-db
      - name: Syntax checks
        run: |
          bash -n install.sh shell/bash/complete_me.bash
          fish -n shell/fish/complete_me.fish
      - name: Tests
        run: python3 -m unittest discover -s tests -v

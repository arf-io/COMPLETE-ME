name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Shells and tools the end-to-end tests drive
        run: sudo apt-get update && sudo apt-get install -y fish zsh bubblewrap man-db
      - name: Syntax checks
        run: |
          bash -n install.sh shell/bash/complete_me.bash
          fish -n shell/fish/complete_me.fish
          zsh -n shell/zsh/complete_me.zsh
      - name: Tests (goldens + fish/bash/zsh end-to-end)
        run: cargo test --release --locked
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings
        continue-on-error: true
